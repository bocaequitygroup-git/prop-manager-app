<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Propagation Manager Console - Ngapori Ranch</title>
<style>
/* Sun theme is the default: near-black on white, 2px edges, 48px touch targets, status shown by glyph + pattern as well as color. Night theme is a toggle. */
:root{--bg:#eef2ec;--card:#fff;--ink:#07110b;--mute:#2f3f35;--line:#5c6d62;--edge:#07110b;--acc:#0a5a28;--acci:#fff;--accs:#d3efdb;--warn:#7a3000;--warns:#ffd8a6;--warnb:#e27100;--bad:#a0001b;--bads:#ffd5db;--blue:#0b3f8f;--blues:#dbe8ff}
[data-theme=night]{--bg:#0a110d;--card:#141f18;--ink:#f6faf7;--mute:#c3d2c9;--line:#7d968a;--edge:#f6faf7;--acc:#63e590;--acci:#03200e;--accs:#173a25;--warn:#ffc37a;--warns:#3d2a0c;--warnb:#ff9d1f;--bad:#ff8b9b;--bads:#42121b;--blue:#9cc2ff;--blues:#12284a;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 6px}p{margin:6px 0}
.k{color:var(--mute);font-size:14px}.sp{flex:1}.hidden{display:none!important}b{font-weight:700}
button,input,select{font:inherit;color:var(--ink)}
input,select{min-height:48px;padding:8px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--card);max-width:100%}
button{min-height:48px;padding:8px 14px;border:2px solid var(--edge);border-radius:10px;background:var(--acc);color:var(--acci);font-weight:700;cursor:pointer}
button.alt{background:var(--card);color:var(--ink)}button.on{background:var(--ink);color:var(--bg)}button.sm{min-height:40px;padding:4px 10px;font-size:15px}
button.dng{background:var(--bad);color:#fff}button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
input[type=checkbox]{min-height:0;width:24px;height:24px;accent-color:var(--acc)}
#top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px solid var(--edge)}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px}
#cbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 14px;font-size:15px;border-top:2px solid var(--edge);background:var(--accs)}
#cbar.off{background:var(--warns);color:var(--warn)}#cbar.stale{background:var(--bads);color:var(--bad)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--edge);display:inline-block}#cbar.off .dot{background:var(--warnb);border-radius:3px}
#cbar.sync .dot{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(prefers-reduced-motion:reduce){#cbar.sync .dot{animation:none}}
.note{background:var(--warns);color:var(--warn);border:2px solid var(--warnb);border-radius:10px;padding:8px 12px;margin:10px 14px;font-weight:600}
.note.bad{background:var(--bads);color:var(--bad);border-color:var(--bad)}
#kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:10px 14px 0}
.kp{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:8px 12px;min-height:0;display:block;font-weight:400}
.kp b{display:block;font-size:26px;line-height:1.1}.kp.hot{border-color:var(--warnb);background:var(--warns);color:var(--warn)}.kp.hot b{color:var(--warn)}
.lay{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);gap:14px;padding:12px 14px 40px;align-items:start}
@media(max-width:980px){.lay{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--edge);border-radius:14px;padding:14px}
#side{position:sticky;top:var(--hh,120px);max-height:calc(100vh - var(--hh,120px) - 12px);overflow:auto;padding:0}
@media(max-width:980px){#side{position:static;max-height:none;overflow:visible}}
#tabs{display:flex;gap:6px;padding:8px;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--edge);border-radius:12px 12px 0 0}
@media(max-width:980px){#tabs{top:var(--hh,120px)}}
#tabs button{flex:1;padding:6px 4px}#pane{padding:12px 14px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{min-height:44px}
.badge{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;border:2px solid var(--edge);background:var(--card);color:var(--ink);white-space:nowrap}
.badge.st-occupied,.badge.ok{background:var(--accs);border-color:var(--acc)}.badge.st-ready{background:var(--accs);border-color:var(--acc)}
.badge.st-attention,.badge.wait{background:var(--warns);color:var(--warn);border-color:var(--warnb)}.badge.bad{background:var(--bads);color:var(--bad);border-color:var(--bad)}
.badge.st-post{background:repeating-linear-gradient(45deg,#c3c9c5 0 4px,#e8ece9 4px 8px);color:#000}.badge.open{background:var(--blues);color:var(--blue);border-color:var(--blue)}
.badge.ws-IN_PROGRESS{background:var(--accs);border-color:var(--acc)}.badge.ws-PAUSED{background:var(--warns);color:var(--warn);border-color:var(--warnb)}.badge.ws-ASSIGNED{background:var(--blues);color:var(--blue);border-color:var(--blue)}
.trk{margin:12px 0 4px;display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--edge);padding-bottom:2px}
.wg{margin:8px 0 12px}.wh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);font-weight:400;border-left-width:8px;padding:6px 10px;min-height:48px;margin-bottom:6px}
.wh.sel{outline:4px solid var(--edge);outline-offset:1px}.wh .sw{width:16px;height:16px;border-radius:4px;border:2px solid var(--edge)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.cells .cell{aspect-ratio:1;min-height:0;min-width:0;padding:0;font-size:11px;border-radius:6px;position:relative;background:var(--c,#555);color:#fff;border:3px solid transparent;text-shadow:0 0 2px #000,0 0 2px #000;overflow:hidden}
.cell.st-attention{border-color:var(--warnb)}.cell.st-attention::after,.cell.st-ready::after,.cell.st-post::after{position:absolute;top:0;right:0;font-size:11px;line-height:1;padding:1px 4px;border-radius:0 0 0 6px;text-shadow:none;color:#000;background:var(--warnb)}
.cell.st-attention::after{content:"!"}.cell.st-ready{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}.cell.st-ready::after{content:"\2192";background:#fff}
.cell.st-post{background:repeating-linear-gradient(45deg,#7d8780 0 5px,#d4dad6 5px 10px);color:#000;text-shadow:none;border-color:#000}.cell.st-post::after{content:"S";background:#fff}
.cell.sel{outline:4px solid var(--edge);outline-offset:1px;z-index:1}.cells .cell.e{background:transparent;border:2px dashed var(--line);cursor:default}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0}.leg span{display:inline-flex;gap:6px;align-items:center}.leg i{width:18px;height:18px;border-radius:4px;border:2px solid var(--edge);display:inline-block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.facts div{border:2px solid var(--line);border-radius:10px;padding:6px 10px}.facts b{display:block}
.blk{border:2px solid var(--edge);border-radius:12px;padding:10px 12px;margin:12px 0}.blk h3{margin-top:0}
.g{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line)}.g .n{flex:1;min-width:190px}
.act{border-bottom:2px dashed var(--line);padding:6px 0}.act label{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;cursor:pointer}.act .n{flex:1;min-width:170px}
.act .d{font-size:14px;color:var(--mute);margin:2px 0 4px 34px}.act details{margin:4px 0 4px 34px}
details{border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:6px 0}summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.frm input[type=text]{flex:1;min-width:170px}.frm input[type=number]{width:96px}.frm input.u{width:110px}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 12px}.team label{display:flex;gap:10px;align-items:center;min-height:44px}
.wk{border:2px solid var(--edge);border-left-width:10px;border-radius:12px;padding:8px 12px;margin:8px 0}.wk.ws-IN_PROGRESS{border-left-color:var(--acc)}.wk.ws-PAUSED{border-left-color:var(--warnb);background:var(--warns);color:var(--warn)}.wk.ws-ASSIGNED{border-left-color:var(--blue)}.wk.ws-IDLE{border-left-color:var(--line)}
.al{border:2px solid var(--warnb);background:var(--warns);color:var(--warn);border-radius:12px;padding:8px 12px;margin:8px 0}.al .k{color:var(--warn)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:5px 8px;border-bottom:2px solid var(--line);font-size:14px;vertical-align:top}th{color:var(--mute)}.tw{overflow-x:auto}
#login{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}#login .card{width:min(380px,100%);display:grid;gap:10px}#login label{display:grid;gap:3px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;max-width:92vw;font-weight:700}
body.busy{cursor:progress}
body.out #top,body.out #kpi,body.out .lay,body.out #note{display:none!important}
body.out #login{background:var(--bg)}
.mv{border:2px solid var(--warnb);background:var(--warns);color:var(--warn);border-radius:10px;padding:6px 10px;margin:4px 0}
.rg{margin:4px 0 4px 34px}.rg .team{margin:6px 0}.rg .arrow{font-weight:700;margin:4px 0}
.rv .d{margin-left:0}
</style></head><body>
<div id="top">
<header>
<h1>Propagation Manager</h1><span class="k">Ngapori Ranch · Bay 3</span><span class="sp"></span>
<button class="alt sm" type="button" data-a="sync" id="bRef">Refresh</button>
<button class="alt" id="bMgr" type="button" data-a="mgr">Manager mode: off</button>
<button class="alt sm" id="bTheme" type="button" data-a="theme">Night</button>
</header>
<div id="cbar" class="sync"><span class="dot"></span><b>Connecting…</b></div>
</div>
<div id="note" class="note hidden" role="alert"></div>
<div id="kpi"></div>
<div class="lay">
<section class="card" id="left"><p class="k">Loading the propagation room…</p></section>
<aside class="card" id="side"><div id="tabs" role="tablist"></div><div id="pane"></div></aside>
</div>
<div id="login" class="hidden" role="dialog" aria-modal="true" aria-label="Sign in"><div class="card">
<h2>Propagation Manager</h2><p class="k">Ranch propagation console for managers and founders. You are signed out after 15 minutes without use.</p>
<label>Worker ID <span id="luw"></span></label>
<label>PIN <input id="lp" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN"></label>
<div id="lerr" class="note bad hidden" role="alert" style="margin:0"></div>
<div class="row" style="margin:0"><button id="lgo" type="button" data-a="login">Sign in</button></div></div></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script>
"use strict";
const API_URL = "https://script.google.com/macros/s/AKfycbz7qyhFT5BRUpiqLCnjtT8gRX-UQ-I0lQhF__H6dgCU_Rql2WFOMuNm-YLXazi0Zrir_g/exec"; // same Apps Script web app as the assignment board (ends in /exec)
const POLL_MS = 60000, IDLE_MS = 15 * 60000, STALE_MIN = 30, BAY_SQFT = 800;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => s ? new Date(String(s).slice(0, 10) + "T00:00:00").toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}) : "";
const add = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const localToday = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const col = c => `hsl(${[...String(c)].reduce((a, x) => a * 31 + x.charCodeAt(0), 7) % 360} 58% 30%)`;
const clock = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); };
const when = s => { if (!s) return ""; const d = new Date(String(s).length <= 10 ? s + "T00:00:00" : s); return isNaN(d) ? esc(s) : d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); };
const hm = ms => { const m = Math.max(0, Math.round(ms / 60000)); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const pf = p => p === "F" ? "Field" : p === "G" ? "Greenhouse" : p;
const LS = {get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { v === null || v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }};

const SS = {get(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { v === null || v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }};
// The manager login now lives in this tab only (sessionStorage): a new tab starts signed out, and closing the tab ends the session.
// The old shared copy in localStorage is removed so nobody is silently signed in as the previous user.
LS.set("pm_session", null);

/* ---------- network ---------- */
const hdr = {"Content-Type":"text/plain;charset=utf-8"};
async function call(url, opt) {
  let t, ac = typeof AbortController === "function" ? new AbortController() : null, to = ac ? setTimeout(() => ac.abort(), 90000) : 0;
  try { t = await (await fetch(url, ac ? {...opt, signal: ac.signal} : opt)).text(); } catch (e) { throw new Error(e && e.name === "AbortError" ? "The server took too long to answer. Press Refresh to try again." : "No connection to the server."); } finally { clearTimeout(to); }
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error("The server sent back a web page instead of data. Deploy the latest Code_prop.gs as a new version, then try again."); }
  if (j.error) { if (/^AUTH:/.test(j.error) && M) exitManager("Manager session ended. Turn Manager mode on again."); throw new Error(j.error.replace(/^AUTH:\s*/, "")); }
  return j;
}
async function get(p) { const go = () => call(API_URL + "?" + new URLSearchParams(p)); try { return await go(); } catch (e) { if (!/web page/.test(e.message)) throw e; await new Promise(r => setTimeout(r, 1200)); return go(); } }
const post = b => call(API_URL, {method:"POST", headers:hdr, body:JSON.stringify({...b, token: M ? M.token : undefined})});

/* ---------- state ---------- */
let D = null, SNAP = null, MODE = "live", FORCED = false, SYNCING = false, OFFSET = 0, M = SS.get("pm_session"), T = localToday(), SEL = null, RS = {};
let TAB = "wave", FILT = "all", CF = "", CREW = "worker", SQ = +LS.get("pm_sq") || 1.55, BUSY = 0, LAST = Date.now(), RI = [], CD = null, ERR = "";
const PICK = new Set(), WPICK = new Set(), DRAFT = {}, LOADING = {}, RW = {};
let RV = "reassigned", RU = "done", AUTOLOGIN = true;
const nowMs = () => MODE === "live" ? Date.now() + OFFSET : (D ? D.now : Date.now());
const canAct = () => !!M && MODE === "live";
const ST = {occupied:{l:"In propagation", g:"●"}, ready:{l:"Transplant soon", g:"→"}, attention:{l:"Needs attention", g:"!"}, post:{l:"Post-transplant", g:"S"}, empty:{l:"Available", g:"○"}};
const isMove = x => x.kind === "REASSIGN" || x.kind === "UNASSIGN" || (x.kind === "ASSIGN" && !!String(x.note || "").trim());
const MOVEK = {REASSIGN:"Reassigned", UNASSIGN:"Removed", ASSIGN:"Added to team"};
const WS = {IN_PROGRESS:"In progress", PAUSED:"Paused", ASSIGNED:"Assigned", IDLE:"Idle"};
const KIND = {DIRECT_CLOSE:"Direct close", GATE_OVERRIDE:"Gate override", LEAF_OVERRIDE:"First-leaf override", ALERT_RESOLVED:"Alert resolved", ASSIGN:"Assigned", REASSIGN:"Reassigned", UNASSIGN:"Removed"};

/* ---------- derived data ---------- */
const runs = () => D ? D.runs.filter(r => !r.error) : [];
const flat = () => runs().flatMap(r => r.waves.map(w => ({r, w})));
const trackOf = r => { const s = String(r.propLocation || ""), i = s.lastIndexOf(" · "); return i >= 0 ? s.slice(i + 3) : (s || "Unassigned"); };
const gateOk = g => (g.completed && g.verified) || g.overridden;
const leafOk = w => !!w.leaf && (w.leaf.outcome === "PASS" || w.leaf.outcome === "OVERRIDDEN");
const openAlerts = () => D ? D.alerts.filter(a => a.status === "OPEN") : [];
const postOpen = r => { const g = (r.gates || []).filter(x => x.scope === "post-transplant"); return g.length > 0 && !g.every(gateOk); };
function leafDue(w, t) { const ph = (w.phases || []).find(p => p.phase === "Nursery" && p.days > 0); return !!ph && t >= ph.start; }
function wst(r, w, t) {   // [status, label] of one wave on date t
  if (t >= w.plant) return postOpen(r) && t < add(w.plant, 30) ? ["post", "Post-transplant: bench sanitizing not verified"] : ["done", "Planted"];
  if (t < w.sow) return ["pend", "Not in the room yet · sow in " + days(t, w.sow) + " d"];
  const why = [], pre = (r.gates || []).filter(g => g.scope === "pre-sowing");
  if (!w.init) why.push("Not initiated");
  if (pre.some(g => !gateOk(g))) why.push("Bench not verified ready");
  if (!r.direct) { if (w.leaf && w.leaf.outcome === "FAIL") why.push("First-leaf check FAILED"); else if (!leafOk(w) && leafDue(w, t)) why.push("First-leaf check due"); }
  if (openAlerts().some(a => a.run_id === r.runId)) why.push("Stall alert open");
  if (why.length) return ["attention", why.join(" · ")];
  const left = days(t, w.plant), ph = (w.phases || []).find(p => p.start <= t && t < p.end);
  return left <= 3 ? ["ready", "Transplant in " + left + " d"] : ["occupied", "In propagation" + (ph ? " · " + ph.phase : "")];
}
function roomItems(t) { const o = []; flat().forEach(({r, w}) => { if (!(w.trays > 0)) return; const [k, l] = wst(r, w, t); if (k === "pend" || k === "done") return; o.push({r, w, k, l, track: trackOf(r)}); }); return o; }
const badge = (k, l) => `<span class="badge st-${k}">${ST[k].g} ${esc(l || ST[k].l)}</span>`;

/* ---------- snapshot + sync ---------- */
function saveSnap() {
  const o = {saved: SNAP, data: D};
  if (!LS.set("pm_snap", o)) LS.set("pm_snap", {saved: SNAP, data: {...D, alerts: D.alerts.slice(-30), assignLog: (D.assignLog || []).slice(0, 40), unverified: (D.unverified || []).slice(0, 60), mgrLog: D.mgrLog.slice(0, 20)}});
}
function loadSnap() { const s = LS.get("pm_snap"); if (s && s.data && s.data.runs) { D = s.data; SNAP = s.saved; return true; } return false; }
async function load(quiet) {
  if (!M) return;
  if (MODE === "offline" && FORCED) return;
  SYNCING = true; connBar();
  try {
    const d = await get({action:"monitor", token:M.token});
    D = d; OFFSET = d.now - Date.now(); MODE = "live"; SNAP = new Date().toISOString(); ERR = ""; saveSnap();
  } catch (e) {
    ERR = /Unknown action/.test(e.message) ? "The server has no manager console yet. Deploy the latest Code_prop.gs as a new version, then press Sync now." : e.message;
    if (!D) loadSnap();
    if (D) MODE = "offline";
    if (!quiet) toast(ERR, true);
  } finally { SYNCING = false; }
  render(true);
}
function goOffline() { if (!D && !loadSnap()) return toast("No snapshot saved on this device yet. Sync once while online.", true); MODE = "offline"; FORCED = true; render(); }
function goLive() { FORCED = false; MODE = "live"; load(); }
function connBar() {
  const el = $("cbar"), age = SNAP ? Math.round((Date.now() - Date.parse(SNAP)) / 60000) : 0;
  if (SYNCING) { el.className = "sync"; el.innerHTML = `<span class="dot"></span><b>Syncing…</b>`; return; }
  if (MODE === "live") { el.className = ""; el.innerHTML = `<span class="dot"></span><b>LIVE</b><span>Synced ${esc(clock(SNAP))} · auto-sync every 60 s</span><span class="sp"></span><button class="alt sm" type="button" data-a="sync">Sync now</button><button class="alt sm" type="button" data-a="offline">Work offline</button>`; return; }
  el.className = age > STALE_MIN ? "off stale" : "off";
  el.innerHTML = `<span class="dot"></span><b>OFFLINE SNAPSHOT</b><span>${SNAP ? "Saved " + esc(clock(SNAP)) + " · " + age + " min old" : "No snapshot"} · read-only${FORCED ? "" : " · retrying automatically"}</span><span class="sp"></span><button class="alt sm" type="button" data-a="live">Go live</button>`;
}

/* ---------- manager mode (PIN) ---------- */
function openLogin() {
  $("luw").innerHTML = `<input id="lu" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Worker ID" aria-label="Worker ID">`;
  $("lp").value = ""; $("lerr").classList.add("hidden"); $("login").classList.remove("hidden"); setTimeout(() => $("lu").focus(), 0);
}
async function doLogin() {

function milestones() {

    if (!w.init && d <= 14) o.push({d, t:"Not initiated", n:nm, sel, bad:d <= 0, when:d < 0 ? "Sow date passed " + (-d) + " d ago" : d === 0 ? "Sow today" : "Sow in " + d + " d"});
    if (!w.init || t < w.sow) return;
    (w.phases || []).forEach(p => { if (p.days > 0 && p.start <= t && t < p.end) o.push({d:days(t, p.end), t:p.phase + " ends", n:nm, sel, when:fmt(p.end)}); });

}

  const rs = await write("Saving first-leaf check", () => post({action:"firstLeaf", runId:run, wave, outcome:o, notes}));
  if (rs) { delete DRAFT[dk("l", run, wave)]; delete DRAFT[dk("lo", run, wave)]; } done(rs, o === "PENDING" ? "First-leaf check reset" : "First-leaf check: " + o.toLowerCase());
}
async function doAssign() {
  const c = cur(); if (!c || !c.rs) return; const ids = [...PICK], wk = [...WPICK];
  const nk = dk("an", c.r.runId), note = (DRAFT[nk] || "").trim(), chg = c.rs.activities.filter(x => PICK.has(x.id) && x.assignee && [...WPICK].sort().join(";") !== (x.assigneeIds || []).map(String).sort().join(";"));
  if (chg.length && !note) return toast("Write a short note explaining the reassignment first. It is required and is kept in the trail.", true);
  const had = c.rs.activities.filter(a => PICK.has(a.id) && a.assignee), live = c.rs.activities.filter(a => PICK.has(a.id) && a.sessions && a.sessions.length);
  if (had.length && !confirm(`${had.length} of the ticked activities already ${had.length > 1 ? "have" : "has"} a team. Assigning replaces ${had.length > 1 ? "those teams" : "that team"}. The change is kept in the assignment trail.` + (live.length ? `\n\n${live.length} ${live.length > 1 ? "have" : "has"} a worker mid-session. They can still close it.` : ""))) return;
  const rs = await write(`Assigning ${ids.length} activit${ids.length > 1 ? "ies" : "y"}… this can take up to a minute`, () => post({action:"assign", runId:c.r.runId, activityIds:ids, workerIds:wk, due:$("due") ? $("due").value : "", note:chg.length ? note : ""}));
  if (rs) { PICK.clear(); delete DRAFT[nk]; } done(rs, "Assigned");
}
async function doReassign(id) {
  const c = cur(); if (!c || !c.rs) return; const run = c.r.runId, a = c.rs.activities.find(x => x.id === id); if (!a) return;
  const key = run + "|" + id, nk = dk("rn", run, id), ids = [...(RW[key] || new Set())], note = (DRAFT[nk] || "").trim();
  if (!ids.length) return toast("Tick who it goes to.", true);
  if (a.assignee && ids.slice().sort().join(";") === (a.assigneeIds || []).map(String).sort().join(";")) return toast("That is the same team. Tick a different worker first.", true);
  if (a.assignee && !note) return toast("Write a short note explaining the reassignment first. It is required and is kept in the trail.", true);
  const to = D.workers.filter(x => ids.includes(String(x.id))).map(x => x.name).join(", "), from = String(a.assignee || "Unassigned").replace(/;\s*/g, ", ");
  if (a.assignee && !confirm(`Reassign ${id} ${a.name}?\n\nFrom: ${from}\nTo: ${to}\nBy: ${M.name}\nNote: ${note}` + (a.sessions && a.sessions.length ? "\n\nA worker is mid-session on this activity. They can still close it." : ""))) return;
  const rs = await write("Reassigning " + id, () => post({action:"assign", runId:run, activityIds:[id], workerIds:ids, note}));
  if (rs) { delete RW[key]; delete DRAFT[nk]; } done(rs, a.assignee ? "Reassigned " + id : "Assigned " + id);
}
async function doFixMove(id) {
  const c = cur(); if (!c || !c.rs) return; const a = c.rs.activities.find(x => x.id === id); if (!a) return;
  const m = (a.history || []).filter(isMove), l = m[m.length - 1]; if (!l) return;
  const keep = (a.assignees || []).filter(x => x.name === l.to), drop = (a.assignees || []).filter(x => x.name !== l.to);
  if (!keep.length || !drop.length) return toast("Nothing to remove.", true);
  const note = (l.note || "Previous owner removed").slice(0, 300);
  if (!confirm(`Make ${id} a full reassignment?\n\nFrom: ${drop.map(x => x.name).join(", ")}\nTo: ${keep.map(x => x.name).join(", ")}\nBy: ${M.name}\nNote: ${note}\n\n${drop.map(x => x.name).join(", ")} will no longer be accountable for it.`)) return;
  const rs = await write("Removing previous owner", () => post({action:"assign", runId:c.r.runId, activityIds:[id], workerIds:keep.map(x => x.id).filter(Boolean), note}));
  done(rs, "Previous owner removed from " + id);
}
async function doInit() {
  const c = cur(); if (!c || !c.w) return;
  const r = await write("Initiating wave… this can take 10 to 20 seconds", () => post({action:"initWaves", runId:c.r.runId, waves:[c.w.wave]}));
  if (r) { c.w.init = {at:new Date().toISOString(), by:M.name}; delete RS[c.r.runId]; toast("Wave initiated"); } render(); load(true);
}
async function doResolve(id) {
  const note = (DRAFT[dk("ra", id)] || "").trim(); if (!note) return toast("Type what was done first. It is required and is logged.", true);
  const r = await write("Resolving alert", () => post({action:"resolveAlert", alertId:id, note})); if (r) { delete DRAFT[dk("ra", id)]; toast("Alert resolved"); } render(); load(true);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  LAST = Date.now(); const b = e.target.closest("[data-a],[data-sel]"); if (!b) return; const d = b.dataset;
  if (d.sel) { const [id, w] = d.sel.split("|"); pick(id, w); render(); if (window.innerWidth <= 980) $("side").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  switch (d.a) {
    case "sync": FORCED ? goLive() : load(); break;
    case "switch": exitManager(); if (MODE === "live") openLogin(); else toast("Go live first, then sign in as the other manager.", true); break; case "offline": goOffline(); break; case "live": goLive(); break;
    case "mgr": M ? exitManager("Signed out") : openLogin(); break;
    case "login": doLogin(); break; case "loginx": $("login").classList.add("hidden"); break;
    case "theme": { const n = document.documentElement.dataset.theme === "night" ? "sun" : "night"; document.documentElement.dataset.theme = n; LS.set("pm_theme", n); header(); break; }
    case "tab": TAB = d.tab; if (d.rv) RV = d.rv; if (d.ru) RU = d.ru; side(); break;
    case "filt": FILT = d.f; render(true); break;
    case "day": T = d.d === "0" ? localToday() : add(T, +d.d); render(); break;
    case "crewv": CREW = d.v; side(); break;
    case "pickall": { const c = cur(); if (c && c.rs) { PICK.clear(); c.rs.activities.forEach(a => { if (d.m === "all" || (d.m === "un" && !a.assignee)) PICK.add(a.id); }); side(); } break; }
    case "rgo": if (gate()) doReassign(d.id); break; case "fixmove": if (gate()) doFixMove(d.id); break;
    case "rv": RV = d.v; side(); break; case "ru": RU = d.v; side(); break;
    case "verify": if (gate()) doVerify(d.id); break; case "verifyall": if (gate()) doVerifyAll(); break;
    case "close": if (gate()) doClose(d.id); break; case "override": if (gate()) doOverride(d.id); break;
    case "leaf": if (gate()) doLeaf(d.o); break; case "assign": if (gate()) doAssign(); break;
    case "init": if (gate()) doInit(); break; case "resolve": if (gate()) doResolve(d.id); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset || {};
  if (d.pick) { t.checked ? PICK.add(d.pick) : PICK.delete(d.pick); const c = cur(); if (c) side(); }
  else if (d.rw) { const [run, id, wid] = d.rw.split("|"), key = run + "|" + id, rs = RS[run], a = rs && rs.activities.find(x => x.id === id);
    const s = RW[key] || (RW[key] = new Set()); t.checked ? s.add(wid) : s.delete(wid); side(); }
  else if (d.wk) { t.checked ? WPICK.add(d.wk) : WPICK.delete(d.wk); const c = cur(); if (c) side(); }
  else if (t.id === "day") { T = t.value || T; render(); }
  else if (t.id === "cf") { CF = t.value; render(true); }
  else if (t.id === "sq") { SQ = Math.max(0.5, +t.value || 1.55); LS.set("pm_sq", SQ); render(true); }
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.d; if (k) DRAFT[k] = e.target.value; });
["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { LAST = Date.now(); }, {passive:true}));
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "lu") { e.preventDefault(); $("lp").focus(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && M) $("login").classList.add("hidden"); });

/* ---------- boot ---------- */
document.documentElement.dataset.theme = LS.get("pm_theme") === "night" ? "night" : "sun";
if (M) { const last = SS.get("pm_last"); if (last && Date.now() - last > IDLE_MS) { M = null; SS.set("pm_session", null); SS.set("pm_last", null); } }
setInterval(() => { if (M) SS.set("pm_last", LAST); }, 10000);
setInterval(tick, 15000);
setInterval(() => { if (!document.hidden && !BUSY && !(MODE === "offline" && FORCED)) load(true); }, POLL_MS);
setInterval(() => { if (M && Date.now() - LAST > IDLE_MS) exitManager("Manager mode turned off after 15 minutes without use."); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !BUSY && !(MODE === "offline" && FORCED) && Date.now() - Date.parse(SNAP || 0) > 30000) load(true); });
window.addEventListener("online", () => { if (!FORCED) load(true); });
if (M) { if (loadSnap()) MODE = "offline"; render(); load(true); }   // signed in on this tab: paint the last snapshot, then sync
else { LS.set("pm_snap", null); render(); openLogin(); }   // signed out: only the sign-in box, nothing loads
</script></body></html>
